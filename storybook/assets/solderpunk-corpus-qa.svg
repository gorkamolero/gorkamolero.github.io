<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Solderpunk corpus Q&amp;A proof</title>
  <desc id="desc">A public-safe diagram showing a Solderpunk corpus question about creating a Reese bass on the Moog Minitaur, cited local sources, a paraphrased answer, and a release boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101216"/>
      <stop offset="0.52" stop-color="#161411"/>
      <stop offset="1" stop-color="#0d1412"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0b15f"/>
      <stop offset="1" stop-color="#5cc8a7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <style>
      .bg { fill: url(#bg); }
      .card { fill: #191b1f; stroke: #37312a; stroke-width: 1.4; filter: url(#shadow); }
      .soft { fill: #12171a; stroke: #2f3735; stroke-width: 1.2; }
      .tag { fill: #27211b; stroke: #a66d34; stroke-width: 1; }
      .tag2 { fill: #152420; stroke: #4fa98d; stroke-width: 1; }
      .label { fill: #9aa39d; font: 500 20px Arial, sans-serif; letter-spacing: 0; }
      .small { fill: #aeb7b1; font: 400 18px Arial, sans-serif; letter-spacing: 0; }
      .tiny { fill: #87918b; font: 400 15px Arial, sans-serif; letter-spacing: 0; }
      .title { fill: #f5efe2; font: 700 46px Arial, sans-serif; letter-spacing: 0; }
      .question { fill: #ffffff; font: 700 30px Arial, sans-serif; letter-spacing: 0; }
      .answer { fill: #e7ece5; font: 400 21px Arial, sans-serif; letter-spacing: 0; }
      .answerBold { fill: #ffffff; font: 700 21px Arial, sans-serif; letter-spacing: 0; }
      .mono { fill: #d7e7dc; font: 400 17px "SFMono-Regular", Consolas, monospace; letter-spacing: 0; }
      .line { stroke: #39413d; stroke-width: 2; fill: none; }
      .accentLine { stroke: url(#accent); stroke-width: 4; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="780"/>
  <path class="accentLine" d="M70 88 H520"/>
  <text class="label" x="70" y="64">Solderpunk public-safe corpus proof</text>
  <text class="title" x="70" y="136">Instrument research becomes usable Q&amp;A</text>
  <text class="small" x="70" y="177">Local corpus, app lessons, and source citations are condensed into a safe answer for a working musician.</text>

  <rect class="card" x="70" y="225" width="500" height="190" rx="8"/>
  <rect class="tag" x="100" y="255" width="118" height="34" rx="6"/>
  <text class="tiny" x="122" y="277">QUESTION</text>
  <text class="question" x="100" y="328">How do I make a</text>
  <text class="question" x="100" y="365">Reese-style bass</text>
  <text class="question" x="100" y="402">on the Minitaur?</text>

  <rect class="card" x="630" y="225" width="500" height="190" rx="8"/>
  <rect class="tag2" x="660" y="255" width="122" height="34" rx="6"/>
  <text class="tiny" x="686" y="277">SOURCES</text>
  <text class="mono" x="660" y="324">research/minitaur/SKILL.md</text>
  <text class="mono" x="660" y="355">research/minitaur/claude.md</text>
  <text class="mono" x="660" y="386">packages/web/src/lib/minitaur/lessons.ts</text>

  <path class="line" d="M570 320 C590 320 610 320 630 320"/>
  <path class="accentLine" d="M580 318 H620"/>

  <rect class="card" x="70" y="460" width="1060" height="215" rx="8"/>
  <text class="label" x="100" y="502">PARAPHRASED ANSWER</text>
  <text class="answer" x="100" y="548"><tspan class="answerBold">1.</tspan> Use both oscillators as saws or squares; offset VCO2 slightly and add Beat detune until the bass churns.</text>
  <text class="answer" x="100" y="584"><tspan class="answerBold">2.</tspan> Keep Note Sync off for this patch, because free-running phase drift is part of the movement.</text>
  <text class="answer" x="100" y="620"><tspan class="answerBold">3.</tspan> Run the filter low with moderate resonance, hold the amp sustain high, and add a tiny release to avoid clicks.</text>
  <text class="answer" x="100" y="656"><tspan class="answerBold">4.</tspan> Move the filter slowly with LFO-to-VCF or manual cutoff sweeps; for extra tension, tune VCO2 to a fifth or seventh.</text>

  <rect class="soft" x="70" y="705" width="1060" height="48" rx="8"/>
  <text class="tiny" x="100" y="735">Boundary: no hardware claim, no redistributed manual text, no paid preset content, no private screenshots. This is a cited local-corpus paraphrase.</text>
</svg>
