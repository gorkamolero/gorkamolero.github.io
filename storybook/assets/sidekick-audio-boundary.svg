<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="840" viewBox="0 0 1320 840" role="img" aria-labelledby="title desc">
  <title id="title">Sidekick audio analysis and DAW boundary proof</title>
  <desc id="desc">A public-safe source-grounded screen showing Sidekick audio intake, analysis metrics, generation modes, sidecar tools, and Ableton handoff boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101214"/>
      <stop offset="0.52" stop-color="#171719"/>
      <stop offset="1" stop-color="#101918"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6f264"/>
      <stop offset="0.5" stop-color="#76d5c0"/>
      <stop offset="1" stop-color="#f3a95d"/>
    </linearGradient>
    <style>
      .bg { fill: url(#bg); }
      .panel { fill: #171a1e; stroke: #333a3f; stroke-width: 1.4; }
      .card { fill: #20242a; stroke: #41484f; stroke-width: 1.1; }
      .soft { fill: #14211f; stroke: #38695c; stroke-width: 1.1; }
      .warn { fill: #251d12; stroke: #8b6435; stroke-width: 1.1; }
      .pill { fill: #0f1215; stroke: #4a5359; stroke-width: 1; }
      .line { stroke: #3c444a; stroke-width: 2; fill: none; }
      .flow { stroke: url(#accent); stroke-width: 4; fill: none; stroke-linecap: round; }
      .brand { fill: #f6f1e6; font: 800 34px Arial, sans-serif; letter-spacing: 0; }
      .label { fill: #9fa9aa; font: 700 14px Arial, sans-serif; letter-spacing: 0.12em; }
      .title { fill: #ffffff; font: 700 24px Arial, sans-serif; letter-spacing: 0; }
      .body { fill: #e8ece8; font: 400 17px Arial, sans-serif; letter-spacing: 0; }
      .small { fill: #b8c2bd; font: 400 15px Arial, sans-serif; letter-spacing: 0; }
      .tiny { fill: #89938f; font: 400 13px Arial, sans-serif; letter-spacing: 0; }
      .mono { fill: #e5f2dc; font: 400 14px "SFMono-Regular", Consolas, monospace; letter-spacing: 0; }
      .metric { fill: #d6f264; font: 800 32px Arial, sans-serif; letter-spacing: 0; }
      .orange { fill: #f3a95d; }
      .green { fill: #76d5c0; }
      .lime { fill: #d6f264; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="840"/>
  <rect class="panel" x="42" y="34" width="1236" height="72" rx="10"/>
  <text class="brand" x="72" y="80">Sidekick</text>
  <text class="label" x="230" y="76">AUDIO ANALYSIS AND DAW HANDOFF</text>
  <rect class="pill" x="980" y="54" width="122" height="34" rx="17"/>
  <text class="tiny" x="1012" y="76">fake metrics</text>
  <rect class="pill" x="1118" y="54" width="128" height="34" rx="17"/>
  <text class="tiny" x="1148" y="76">source proof</text>

  <text class="label" x="64" y="146">PRODUCER PANEL</text>
  <rect class="panel" x="64" y="168" width="356" height="532" rx="12"/>
  <rect class="card" x="92" y="198" width="300" height="112" rx="10"/>
  <text class="title" x="116" y="236">Drop audio</text>
  <text class="body" x="116" y="268">MP3, WAV, M4A, AAC,</text>
  <text class="body" x="116" y="292">OGG, FLAC under 50 MB</text>
  <rect class="soft" x="92" y="334" width="300" height="168" rx="10"/>
  <text class="title" x="116" y="374">Analysis surface</text>
  <text class="small" x="116" y="410">BPM, key, energy, style,</text>
  <text class="small" x="116" y="434">instruments, danceability,</text>
  <text class="small" x="116" y="458">mood, loudness</text>
  <rect class="card" x="92" y="526" width="300" height="122" rx="10"/>
  <text class="title" x="116" y="564">Generation modes</text>
  <text class="mono" x="116" y="598">loop | sample | inspiration</text>
  <text class="tiny" x="116" y="624">mode-specific prompt instructions</text>

  <text class="label" x="482" y="146">FAKE PUBLIC ANALYSIS</text>
  <rect class="panel" x="482" y="168" width="356" height="532" rx="12"/>
  <rect class="card" x="512" y="200" width="296" height="150" rx="10"/>
  <text class="label" x="536" y="230">CORE METRICS</text>
  <text class="metric" x="536" y="278">128</text>
  <text class="tiny" x="602" y="276">BPM</text>
  <text class="metric" x="536" y="326">F minor</text>
  <text class="tiny" x="664" y="324">KEY</text>
  <rect class="card" x="512" y="374" width="296" height="128" rx="10"/>
  <text class="label" x="536" y="404">ENERGY</text>
  <rect x="536" y="430" width="224" height="10" rx="5" fill="#0f1215"/>
  <rect x="536" y="430" width="166" height="10" rx="5" class="lime"/>
  <text class="metric" x="536" y="482">74%</text>
  <rect class="card" x="512" y="526" width="296" height="122" rx="10"/>
  <text class="label" x="536" y="556">STYLE TAGS</text>
  <rect class="pill" x="536" y="580" width="84" height="30" rx="6"/>
  <text class="tiny" x="556" y="600">techno</text>
  <rect class="pill" x="632" y="580" width="90" height="30" rx="6"/>
  <text class="tiny" x="650" y="600">driving</text>
  <rect class="pill" x="536" y="616" width="104" height="30" rx="6"/>
  <text class="tiny" x="556" y="636">warehouse</text>

  <text class="label" x="900" y="146">SIDECAR AND DAW BOUNDARY</text>
  <rect class="panel" x="900" y="168" width="356" height="532" rx="12"/>
  <rect class="soft" x="930" y="200" width="296" height="132" rx="10"/>
  <circle class="green" cx="954" cy="230" r="7"/>
  <text class="title" x="974" y="238">Mastra sidecar</text>
  <text class="small" x="954" y="270">tools: generate music, analyze</text>
  <text class="small" x="954" y="294">audio, docs search, OSC execution</text>
  <rect class="card" x="930" y="356" width="296" height="132" rx="10"/>
  <circle class="lime" cx="954" cy="386" r="7"/>
  <text class="title" x="974" y="394">Provider layer</text>
  <text class="small" x="954" y="426">service manager validates params,</text>
  <text class="small" x="954" y="450">falls back across generation APIs</text>
  <rect class="warn" x="930" y="512" width="296" height="136" rx="10"/>
  <circle class="orange" cx="954" cy="542" r="7"/>
  <text class="title" x="974" y="550">Ableton handoff</text>
  <text class="small" x="954" y="582">Tauri commands and OSC control</text>
  <text class="small" x="954" y="606">exist, but this is not a live</text>
  <text class="small" x="954" y="630">DAW-session proof.</text>

  <path class="line" d="M420 434 H482"/>
  <path class="flow" d="M430 434 H472"/>
  <path class="line" d="M838 434 H900"/>
  <path class="flow" d="M848 434 H890"/>

  <rect class="panel" x="64" y="720" width="1192" height="78" rx="10"/>
  <text class="tiny" x="92" y="746">Boundary: source-grounded public proof with fake metrics. It cites UI, sidecar, Essentia, generation-mode, Tauri, and OSC code paths without exposing audio files,</text>
  <text class="tiny" x="92" y="768">provider keys, local paths, DAW sessions, or generated media. Remaining proof: run packaged Tauri shell with disposable audio/provider output, then capture</text>
  <text class="tiny" x="92" y="790">real audio analysis and prompt-to-DAW handoff.</text>
</svg>
