<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Anima and Will creative pipeline</title>
  <desc id="desc">A public-safe diagram of the Anima and Will authoring, asset generation, and playable runtime pipeline.</desc>
  <rect width="1200" height="720" fill="#101318"/>
  <g opacity="0.2" stroke="#f7f4ee" stroke-width="1">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200"/>
    <path d="M120 0V720M240 0V720M360 0V720M480 0V720M600 0V720M720 0V720M840 0V720M960 0V720M1080 0V720"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="7">
    <path d="M188 176C304 128 406 178 518 156C660 128 760 176 922 148" stroke="#b88a35"/>
    <path d="M220 348C382 278 448 394 594 344C726 300 820 366 1000 312" stroke="#3d7ec9"/>
    <path d="M190 560C360 486 488 588 650 514C780 456 872 524 1040 470" stroke="#5b955a"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(72 86)">
      <rect width="260" height="126" rx="14" fill="#f7f4ee"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#101318">Authoring</text>
      <text x="24" y="80" font-size="18" fill="#343b46">StoryScript, scene shape,</text>
      <text x="24" y="106" font-size="18" fill="#343b46">interaction design</text>
    </g>
    <g transform="translate(456 74)">
      <rect width="290" height="150" rx="14" fill="#b88a35"/>
      <text x="24" y="50" font-size="24" font-weight="700" fill="#160f05">Dialogue logic</text>
      <text x="24" y="84" font-size="18" fill="#160f05">Ink, inventory, state,</text>
      <text x="24" y="110" font-size="18" fill="#160f05">battle and quest rules</text>
    </g>
    <g transform="translate(862 92)">
      <rect width="250" height="124" rx="14" fill="#f7f4ee"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#101318">Editor</text>
      <text x="24" y="80" font-size="18" fill="#343b46">React tools, hotspots,</text>
      <text x="24" y="106" font-size="18" fill="#343b46">scene inspection</text>
    </g>
    <g transform="translate(118 306)">
      <rect width="286" height="144" rx="14" fill="#3d7ec9"/>
      <text x="24" y="50" font-size="24" font-weight="700" fill="#07101d">Asset pipeline</text>
      <text x="24" y="84" font-size="18" fill="#07101d">image, spritesheet,</text>
      <text x="24" y="110" font-size="18" fill="#07101d">voice, music, video</text>
    </g>
    <g transform="translate(512 302)">
      <rect width="274" height="150" rx="14" fill="#f7f4ee"/>
      <text x="24" y="50" font-size="24" font-weight="700" fill="#101318">API and data</text>
      <text x="24" y="84" font-size="18" fill="#343b46">Hono, Turso, AI SDK,</text>
      <text x="24" y="110" font-size="18" fill="#343b46">provider boundaries</text>
    </g>
    <g transform="translate(846 312)">
      <rect width="240" height="128" rx="14" fill="#3d7ec9"/>
      <text x="24" y="48" font-size="24" font-weight="700" fill="#07101d">Runtime</text>
      <text x="24" y="82" font-size="18" fill="#07101d">Phaser scenes, player</text>
      <text x="24" y="108" font-size="18" fill="#07101d">actions, feedback</text>
    </g>
    <g transform="translate(268 526)">
      <rect width="284" height="118" rx="14" fill="#5b955a"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#071307">Playable output</text>
      <text x="24" y="80" font-size="18" fill="#071307">point-and-click scene,</text>
      <text x="24" y="106" font-size="18" fill="#071307">inventory, dialogue</text>
    </g>
    <g transform="translate(666 526)">
      <rect width="284" height="118" rx="14" fill="#f7f4ee"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#101318">Review boundary</text>
      <text x="24" y="80" font-size="18" fill="#343b46">rights, references, keys,</text>
      <text x="24" y="106" font-size="18" fill="#343b46">safe public proof</text>
    </g>
