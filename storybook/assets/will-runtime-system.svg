<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Will playable runtime system</title>
  <desc id="desc">A public-safe diagram showing Will as a Phaser and React point-and-click game with Hono API, Ink dialogue, AI dialogue, TTS, battle, inventory, and sprite tooling.</desc>
  <defs>
    <style>
      .bg { fill: #f7f4ee; }
      .panel { fill: #ffffff; stroke: #d9d2c6; stroke-width: 2; }
      .dark { fill: #101318; }
      .blue { fill: #3d7ec9; }
      .red { fill: #b94d42; }
      .green { fill: #5b955a; }
      .gold { fill: #b88a35; }
      .line { stroke: #101318; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .label { font: 800 32px Inter, Arial, sans-serif; letter-spacing: 0; fill: #101318; }
      .small { font: 700 19px Inter, Arial, sans-serif; letter-spacing: 0; fill: #343b46; }
      .tiny { font: 700 16px Inter, Arial, sans-serif; letter-spacing: 0; fill: #343b46; }
      .white { fill: #f7f4ee; }
      .mono { font: 700 17px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0; fill: #101318; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#101318" />
    </marker>
  </defs>

  <rect class="bg" width="1440" height="900" />
  <rect x="54" y="46" width="1332" height="808" rx="8" class="panel" />

  <text x="90" y="108" class="label">Will: playable point-and-click runtime</text>
  <text x="90" y="144" class="small">Concrete game proof for the Anima toolchain: Phaser scenes, React overlays, Ink dialogue, AI/TTS API, and sprite tooling.</text>

  <rect x="90" y="206" width="332" height="482" rx="8" class="dark" />
  <text x="122" y="256" class="white" style="font:800 25px Inter, Arial, sans-serif">Game runtime</text>
  <rect x="122" y="300" width="268" height="56" rx="6" fill="#f7f4ee" />
  <text x="146" y="334" class="mono">Phaser scenes</text>
  <rect x="122" y="386" width="268" height="56" rx="6" fill="#f7f4ee" />
  <text x="146" y="420" class="mono">React overlays</text>
  <rect x="122" y="472" width="268" height="56" rx="6" fill="#f7f4ee" />
  <text x="146" y="506" class="mono">Hotspots + verbs</text>
  <rect x="122" y="558" width="268" height="56" rx="6" fill="#f7f4ee" />
  <text x="146" y="592" class="mono">Inventory + battle</text>

  <rect x="554" y="186" width="332" height="522" rx="8" class="panel" />
  <text x="586" y="236" class="label" style="font-size:25px">Interaction systems</text>
  <rect x="586" y="282" width="268" height="68" rx="6" fill="#e9f0f8" />
  <circle cx="620" cy="316" r="12" class="blue" />
  <text x="644" y="309" class="small">Ink dialogue</text>
  <text x="644" y="334" class="tiny">branching narrative states</text>
  <rect x="586" y="374" width="268" height="68" rx="6" fill="#edf4ec" />
  <circle cx="620" cy="408" r="12" class="green" />
  <text x="644" y="401" class="small">Hono API</text>
  <text x="644" y="426" class="tiny">sessions, dialogue, TTS</text>
  <rect x="586" y="466" width="268" height="68" rx="6" fill="#f6eddc" />
  <circle cx="620" cy="500" r="12" class="gold" />
  <text x="644" y="493" class="small">AI SDK + voices</text>
  <text x="644" y="518" class="tiny">generated replies and audio</text>
  <rect x="586" y="558" width="268" height="68" rx="6" fill="#f3e8e5" />
  <circle cx="620" cy="592" r="12" class="red" />
  <text x="644" y="585" class="small">Sprite tools</text>
  <text x="644" y="610" class="tiny">video-to-spritesheet pipeline</text>

  <rect x="1018" y="206" width="332" height="482" rx="8" class="panel" />
  <text x="1050" y="256" class="label" style="font-size:25px">Proof boundary</text>
  <rect x="1050" y="300" width="268" height="56" rx="6" fill="#f7f4ee" stroke="#d9d2c6" stroke-width="2" />
  <text x="1074" y="334" class="small">Build passed</text>
  <rect x="1050" y="386" width="268" height="56" rx="6" fill="#f7f4ee" stroke="#d9d2c6" stroke-width="2" />
  <text x="1074" y="420" class="small">Typecheck passed</text>
  <rect x="1050" y="472" width="268" height="56" rx="6" fill="#f7f4ee" stroke="#d9d2c6" stroke-width="2" />
  <text x="1074" y="506" class="small">Biome lint passed</text>
  <rect x="1050" y="558" width="268" height="56" rx="6" fill="#f7f4ee" stroke="#d9d2c6" stroke-width="2" />
  <text x="1074" y="592" class="small">API tests need server</text>

  <path d="M 422 447 C 476 447 500 447 554 447" class="line" marker-end="url(#arrow)" />
  <path d="M 886 447 C 940 447 964 447 1018 447" class="line" marker-end="url(#arrow)" />
  <path d="M 1184 688 C 1040 790 430 790 256 688" class="line" marker-end="url(#arrow)" />

  <rect x="90" y="746" width="1260" height="74" rx="8" fill="#ffffff" stroke="#d9d2c6" stroke-width="2" />
  <text x="122" y="780" class="small">Public-safe boundary: no raw story text, generated voices, private prompts, API keys, or unreviewed media are shown.</text>
  <text x="122" y="806" class="tiny">Use as runtime proof for Anima/Will after content/legal review; publish code only after asset and reference audit.</text>
</svg>
