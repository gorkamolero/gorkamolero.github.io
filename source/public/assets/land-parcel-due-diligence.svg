<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Land fake parcel detail and due diligence screen</title>
  <desc id="desc">A synthetic parcel detail screen showing fake parcel signals, outreach state, and automated due diligence without owner or parcel data.</desc>
  <rect width="1280" height="760" fill="#101318"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="72" fill="#f7f4ee" font-size="34" font-weight="800">Land Parcel Review</text>
    <text x="56" y="108" fill="#aeb5c0" font-size="18">Synthetic operator screen. No owner names, addresses, APNs, exact parcels, coordinates, or CRM records.</text>

    <rect x="56" y="150" width="360" height="486" rx="8" fill="#f7f4ee"/>
    <text x="88" y="198" fill="#101318" font-size="24" font-weight="800">Parcel detail</text>
    <text x="88" y="242" fill="#343b46" font-size="17">Parcel: SYN-PARCEL-184</text>
    <text x="88" y="276" fill="#343b46" font-size="17">County: Example County</text>
    <text x="88" y="310" fill="#343b46" font-size="17">Acreage: synthetic</text>
    <text x="88" y="344" fill="#343b46" font-size="17">Access: needs review</text>
    <text x="88" y="378" fill="#343b46" font-size="17">Owner: redacted</text>
    <text x="88" y="412" fill="#343b46" font-size="17">Mailing address: redacted</text>
    <rect x="88" y="470" width="250" height="42" rx="4" fill="#d35d4c"/>
    <text x="112" y="497" fill="#160908" font-size="16" font-weight="800">PII deliberately omitted</text>
    <rect x="88" y="536" width="194" height="42" rx="4" fill="#7bbf7a"/>
    <text x="112" y="563" fill="#071307" font-size="16" font-weight="800">Status: research</text>

    <rect x="464" y="150" width="354" height="486" rx="8" fill="#f7f4ee"/>
    <text x="496" y="198" fill="#101318" font-size="24" font-weight="800">Signal table</text>
    <text x="496" y="244" fill="#343b46" font-size="17">Tax pressure: medium</text>
    <text x="496" y="278" fill="#343b46" font-size="17">Absentee marker: synthetic</text>
    <text x="496" y="312" fill="#343b46" font-size="17">Heir pattern: possible</text>
    <text x="496" y="346" fill="#343b46" font-size="17">Road access: uncertain</text>
    <text x="496" y="380" fill="#343b46" font-size="17">Comparable review: pending</text>
    <rect x="496" y="438" width="250" height="34" rx="4" fill="#b88a35"/>
    <text x="516" y="461" fill="#181104" font-size="15" font-weight="800">Human verification needed</text>
    <rect x="496" y="498" width="230" height="34" rx="4" fill="#7bbf7a"/>
    <text x="516" y="521" fill="#071307" font-size="15" font-weight="800">Score: fake 72</text>
    <rect x="496" y="558" width="274" height="34" rx="4" fill="#4e9af1"/>
    <text x="516" y="581" fill="#07101d" font-size="15" font-weight="800">Next: verify source docs</text>

    <rect x="866" y="150" width="358" height="486" rx="8" fill="#7bbf7a"/>
    <text x="898" y="198" fill="#071307" font-size="24" font-weight="800">Due diligence copilot</text>
    <text x="898" y="244" fill="#071307" font-size="17">Prompt: summarize risks</text>
    <text x="898" y="286" fill="#071307" font-size="17">Check access and title</text>
    <text x="898" y="320" fill="#071307" font-size="17">Compare tax history</text>
    <text x="898" y="354" fill="#071307" font-size="17">Prepare owner questions</text>
    <text x="898" y="388" fill="#071307" font-size="17">Do not contact before review</text>
    <rect x="898" y="456" width="242" height="46" rx="4" fill="#f7f4ee"/>
    <text x="922" y="486" fill="#101318" font-size="16" font-weight="800">Recommendation: hold</text>
    <text x="898" y="552" fill="#071307" font-size="15">AI assists the checklist;</text>
    <text x="898" y="578" fill="#071307" font-size="15">operator judgment owns</text>
    <text x="898" y="604" fill="#071307" font-size="15">the decision.</text>

    <text x="56" y="700" fill="#f7f4ee" font-size="18" font-weight="700">What this proves</text>
    <text x="56" y="728" fill="#aeb5c0" font-size="16">County research, parcel signals, outreach state, and due diligence become an operator workflow instead of loose manual research.</text>
  </g>
</svg>
