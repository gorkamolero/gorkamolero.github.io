<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">StreamTUI terminal workflow</title>
  <desc id="desc">A public-safe diagram of StreamTUI showing search, stream selection, subtitles, player launch, Chromecast gate, JSON output, and agent automation.</desc>
  <rect width="1200" height="720" fill="#101318"/>
  <g opacity="0.22" stroke="#f7f4ee" stroke-width="1">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200"/>
    <path d="M120 0V720M240 0V720M360 0V720M480 0V720M600 0V720M720 0V720M840 0V720M960 0V720M1080 0V720"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="7">
    <path d="M168 170C318 118 420 194 552 154C704 108 812 190 1030 132" stroke="#3d7ec9"/>
    <path d="M174 352C318 300 456 382 604 338C748 294 846 376 1026 306" stroke="#5b955a"/>
    <path d="M218 568C374 498 516 590 672 520C814 456 910 526 1040 462" stroke="#b88a35"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(82 90)">
      <rect width="260" height="128" rx="14" fill="#f7f4ee"/>
      <text x="24" y="48" font-size="24" font-weight="700" fill="#101318">Search</text>
      <text x="24" y="82" font-size="18" fill="#343b46">movie or show query,</text>
      <text x="24" y="108" font-size="18" fill="#343b46">provider results</text>
    </g>
    <g transform="translate(454 82)">
      <rect width="292" height="144" rx="14" fill="#3d7ec9"/>
      <text x="24" y="50" font-size="24" font-weight="700" fill="#07101d">Terminal UI</text>
      <text x="24" y="84" font-size="18" fill="#07101d">keyboard navigation,</text>
      <text x="24" y="110" font-size="18" fill="#07101d">stream selection</text>
    </g>
    <g transform="translate(852 94)">
      <rect width="258" height="126" rx="14" fill="#f7f4ee"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#101318">Subtitles</text>
      <text x="24" y="80" font-size="18" fill="#343b46">language choice,</text>
      <text x="24" y="106" font-size="18" fill="#343b46">player handoff</text>
    </g>
    <g transform="translate(102 310)">
      <rect width="286" height="140" rx="14" fill="#5b955a"/>
      <text x="24" y="48" font-size="24" font-weight="700" fill="#071307">CLI mode</text>
      <text x="24" y="82" font-size="18" fill="#071307">agent-safe commands,</text>
      <text x="24" y="108" font-size="18" fill="#071307">flags, JSON output</text>
    </g>
    <g transform="translate(502 304)">
      <rect width="284" height="150" rx="14" fill="#f7f4ee"/>
      <text x="24" y="50" font-size="24" font-weight="700" fill="#101318">Playback</text>
      <text x="24" y="84" font-size="18" fill="#343b46">VLC workflow,</text>
      <text x="24" y="110" font-size="18" fill="#343b46">stream URL handoff</text>
    </g>
    <g transform="translate(860 318)">
      <rect width="252" height="126" rx="14" fill="#5b955a"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#071307">Chromecast gate</text>
      <text x="24" y="80" font-size="18" fill="#071307">device discovery,</text>
      <text x="24" y="106" font-size="18" fill="#071307">cast path evidence</text>
    </g>
    <g transform="translate(276 534)">
      <rect width="286" height="118" rx="14" fill="#b88a35"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#160f05">Go rewrite</text>
      <text x="24" y="80" font-size="18" fill="#160f05">tests, build, branch,</text>
      <text x="24" y="106" font-size="18" fill="#160f05">clean package shape</text>
    </g>
    <g transform="translate(670 534)">
      <rect width="286" height="118" rx="14" fill="#f7f4ee"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#101318">Agent workflow</text>
      <text x="24" y="80" font-size="18" fill="#343b46">scriptable search,</text>
      <text x="24" y="106" font-size="18" fill="#343b46">machine-readable state</text>
    </g>
  </g>
</svg>
