<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Paperclip OpenRouter demo proof</title>
  <desc id="desc">A sanitized Paperclip OpenRouter demo board transcript showing adapter configuration, heartbeat execution, tool loop, issue status update, final comment, and usage metadata without private board data or API keys.</desc>
  <rect width="1200" height="820" fill="#101318"/>
  <rect x="54" y="46" width="1092" height="728" rx="18" fill="#0b0f14" stroke="#d6cbbb" stroke-width="2"/>
  <rect x="54" y="46" width="1092" height="54" rx="18" fill="#171d24"/>
  <circle cx="88" cy="74" r="8" fill="#cf4f43"/>
  <circle cx="116" cy="74" r="8" fill="#c8952d"/>
  <circle cx="144" cy="74" r="8" fill="#5b955a"/>
  <text x="176" y="81" fill="#f7f4ee" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19" font-weight="700">paperclip-openrouter demo - sanitized</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="21">
    <text x="86" y="144" fill="#6bb2ff">$ npm run build &amp;&amp; npm run smoke</text>
    <text x="86" y="184" fill="#78d38b">tsc passed</text>
    <text x="86" y="222" fill="#78d38b">smoke ok</text>
    <text x="86" y="284" fill="#6bb2ff">$ paperclip heartbeat --agent openrouter-demo --issue DEMO-42</text>
    <text x="86" y="324" fill="#dbe5f1">adapter: openrouter - model: openrouter/fusion - maxTurns: 12</text>
    <text x="86" y="362" fill="#dbe5f1">issue DEMO-42: status assigned -&gt; in_progress</text>
    <text x="86" y="400" fill="#dbe5f1">tool call: get_issue({ "issueId": "DEMO-42" })</text>
    <text x="86" y="438" fill="#dbe5f1">tool call: add_issue_comment({ "issueId": "DEMO-42" })</text>
    <text x="86" y="476" fill="#dbe5f1">tool call: update_issue_status({ "status": "done" })</text>
    <text x="86" y="538" fill="#6bb2ff">$ result</text>
    <text x="86" y="578" fill="#dbe5f1">{ "ok": true, "adapter": "openrouter", "status": "done",</text>
    <text x="118" y="616" fill="#dbe5f1">"model": "openrouter/fusion", "provider": "REDACTED",</text>
    <text x="118" y="654" fill="#dbe5f1">"tokens": "reported when available", "cost": "reported when available" }</text>
  </g>
  <rect x="742" y="676" width="356" height="58" rx="12" fill="#f7f4ee"/>
  <text x="766" y="702" fill="#101318" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800">No API keys, private issues,</text>
  <text x="766" y="724" fill="#101318" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800">board URLs, or model output.</text>
</svg>
