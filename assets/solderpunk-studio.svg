<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Solderpunk creative instrument system</title>
  <desc id="desc">A public-safe diagram of Solderpunk showing browser synth explorers, Web MIDI control, research corpus, local Q&A, and performance feedback.</desc>
  <rect width="1200" height="720" fill="#101318"/>
  <g opacity="0.22" stroke="#f7f4ee" stroke-width="1">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200"/>
    <path d="M120 0V720M240 0V720M360 0V720M480 0V720M600 0V720M720 0V720M840 0V720M960 0V720M1080 0V720"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="7">
    <path d="M190 162C308 118 426 188 552 150C686 110 806 180 986 132" stroke="#b88a35"/>
    <path d="M180 362C338 280 456 390 604 338C742 290 840 368 1026 306" stroke="#d35d4c"/>
    <path d="M226 568C382 486 502 596 660 516C810 440 900 532 1042 462" stroke="#5b955a"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(80 90)">
      <rect width="270" height="132" rx="14" fill="#f7f4ee"/>
      <text x="24" y="48" font-size="24" font-weight="700" fill="#101318">Synth explorer</text>
      <text x="24" y="82" font-size="18" fill="#343b46">browser instruments,</text>
      <text x="24" y="108" font-size="18" fill="#343b46">parameters, presets</text>
    </g>
    <g transform="translate(456 80)">
      <rect width="286" height="148" rx="14" fill="#b88a35"/>
      <text x="24" y="50" font-size="24" font-weight="700" fill="#160f05">Web MIDI</text>
      <text x="24" y="84" font-size="18" fill="#160f05">hardware control,</text>
      <text x="24" y="110" font-size="18" fill="#160f05">live parameter feel</text>
    </g>
    <g transform="translate(850 96)">
      <rect width="260" height="126" rx="14" fill="#f7f4ee"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#101318">Sound engine</text>
      <text x="24" y="80" font-size="18" fill="#343b46">oscillators, filters,</text>
      <text x="24" y="106" font-size="18" fill="#343b46">envelopes, effects</text>
    </g>
    <g transform="translate(104 312)">
      <rect width="286" height="138" rx="14" fill="#d35d4c"/>
      <text x="24" y="48" font-size="24" font-weight="700" fill="#160908">Instrument corpus</text>
      <text x="24" y="82" font-size="18" fill="#160908">cited research, manuals,</text>
      <text x="24" y="108" font-size="18" fill="#160908">design references</text>
    </g>
    <g transform="translate(500 306)">
      <rect width="286" height="150" rx="14" fill="#f7f4ee"/>
      <text x="24" y="50" font-size="24" font-weight="700" fill="#101318">Local Q&A</text>
      <text x="24" y="84" font-size="18" fill="#343b46">QMD search, agent</text>
      <text x="24" y="110" font-size="18" fill="#343b46">answers, source context</text>
    </g>
    <g transform="translate(862 318)">
      <rect width="248" height="124" rx="14" fill="#d35d4c"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#160908">Learning loop</text>
      <text x="24" y="80" font-size="18" fill="#160908">listen, tweak, inspect,</text>
      <text x="24" y="106" font-size="18" fill="#160908">compare, perform</text>
    </g>
    <g transform="translate(262 534)">
      <rect width="286" height="118" rx="14" fill="#5b955a"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#071307">Creative product</text>
      <text x="24" y="80" font-size="18" fill="#071307">technical sound design</text>
      <text x="24" y="106" font-size="18" fill="#071307">made explorable</text>
    </g>
    <g transform="translate(664 534)">
      <rect width="286" height="118" rx="14" fill="#f7f4ee"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#101318">Public release</text>
      <text x="24" y="80" font-size="18" fill="#343b46">no env vars, clean README,</text>
      <text x="24" y="106" font-size="18" fill="#343b46">screenshot/demo needed</text>
    </g>
  </g>
</svg>
