      <path d="M0 302 C86 278 142 318 232 284 C316 252 388 286 456 246 C532 202 587 220 650 184" fill="none" stroke="#d6dfcd" stroke-width="34" stroke-linecap="round"/>
      <path d="M80 452 C146 392 198 372 272 396 C344 420 426 400 494 354 C554 314 606 304 650 320" fill="none" stroke="#d8c8b1" stroke-width="18" stroke-linecap="round"/>
      <g fill="none" stroke="#9fb99b" stroke-width="2" opacity="0.65">
        <circle cx="332" cy="236" r="82"/>
        <circle cx="332" cy="236" r="154"/>
        <circle cx="332" cy="236" r="226"/>
      </g>
      <g stroke="#fffdf8" stroke-width="5">
        <circle cx="226" cy="172" r="13" fill="#1d6f42"/>
        <circle cx="372" cy="214" r="13" fill="#b87820"/>
        <circle cx="482" cy="142" r="13" fill="#8d2c2c"/>
        <circle cx="302" cy="332" r="13" fill="#1d6f42"/>
        <circle cx="526" cy="304" r="13" fill="#b87820"/>
        <circle cx="134" cy="282" r="13" fill="#46505a"/>
      </g>
      <g transform="translate(26 26)">
        <rect width="238" height="84" rx="7" fill="#fffdf8" stroke="#d8cbb8"/>
        <text x="18" y="30" font-size="18" font-weight="800" fill="#101318">Map filters</text>
        <text x="18" y="58" font-size="15" fill="#46505a">vacant + absentee + within 25mi</text>
      </g>
      <g transform="translate(384 338)">
        <rect width="226" height="80" rx="7" fill="#101318"/>
        <text x="18" y="30" font-size="17" font-weight="800" fill="#fffdf8">Operator center</text>
        <text x="18" y="56" font-size="14" fill="#dbe5f1">distance rings, not real coordinates</text>
      </g>
    </g>

    <g transform="translate(762 174)">
