        <text x="199" y="37" font-size="13" font-weight="800" fill="#8b5514">Review</text>
      </g>

      <g transform="translate(24 306)">
        <rect width="288" height="82" rx="7" fill="#fffdf8"/>
        <text x="18" y="28" font-size="17" font-weight="800" fill="#101318">LOT-K07</text>
        <text x="18" y="54" font-size="14" fill="#46505a">flood flag - weak comps - grade C</text>
        <rect x="186" y="18" width="82" height="26" rx="13" fill="#efd7d3"/>
        <text x="209" y="37" font-size="13" font-weight="800" fill="#8d2c2c">Kill</text>
