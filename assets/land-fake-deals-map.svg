    </g>
    <g transform="translate(356 664)">
      <rect width="242" height="78" rx="8" fill="#f4efe5" stroke="#ddcfb9"/>
      <text x="20" y="31" font-size="18" font-weight="800" fill="#101318">Five-lens DD</text>
