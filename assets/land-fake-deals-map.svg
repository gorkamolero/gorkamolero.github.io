<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Land fake-data deals map</title>
  <desc id="desc">A synthetic operator dashboard for land acquisition, showing fake parcels, map pins, distance rings, due diligence verdicts, CRM stages, and privacy-safe public-data workflow boundaries.</desc>
  <rect width="1200" height="820" fill="#f6f1e8"/>
  <rect x="42" y="38" width="1116" height="744" rx="10" fill="#fffdf8" stroke="#d8cbb8" stroke-width="2"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="78" y="98" font-size="34" font-weight="800" fill="#101318">Land: fake-data deals map</text>
    <text x="78" y="134" font-size="18" font-weight="700" fill="#46505a">Synthetic parcel research board. No owner names, addresses, APNs, coordinates, or CRM rows.</text>

    <g transform="translate(78 174)">
