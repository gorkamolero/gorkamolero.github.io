      <text x="26" y="74" font-size="15" fill="#dbe5f1">All parcels, owners, and values are synthetic.</text>

      <g transform="translate(24 106)">
        <rect width="288" height="82" rx="7" fill="#fffdf8"/>
        <text x="18" y="28" font-size="17" font-weight="800" fill="#101318">LOT-A14</text>
        <text x="18" y="54" font-size="14" fill="#46505a">12.4 ac - vacant - owner grade B</text>
        <rect x="196" y="18" width="72" height="26" rx="13" fill="#dbeedd"/>
        <text x="215" y="37" font-size="13" font-weight="800" fill="#1d6f42">Go</text>
      </g>

      <g transform="translate(24 206)">
        <rect width="288" height="82" rx="7" fill="#fffdf8"/>
        <text x="18" y="28" font-size="17" font-weight="800" fill="#101318">LOT-D39</text>
        <text x="18" y="54" font-size="14" fill="#46505a">4.8 ac - access unclear - grade A</text>
