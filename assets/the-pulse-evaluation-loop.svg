<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="840" viewBox="0 0 1320 840" role="img" aria-labelledby="title desc">
  <title id="title">The Pulse evaluation loop proof</title>
  <desc id="desc">A public-safe source-grounded proof screen showing The Pulse story harness, TUI comparison flow, metrics CLI, and report artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100f14"/>
      <stop offset="0.55" stop-color="#17101d"/>
      <stop offset="1" stop-color="#121a1f"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.5" stop-color="#f9c74f"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <style>
      .bg { fill: url(#bg); }
      .panel { fill: #17181f; stroke: #3a3d49; stroke-width: 1.4; }
      .card { fill: #22232b; stroke: #474b59; stroke-width: 1.1; }
      .soft { fill: #16242a; stroke: #366779; stroke-width: 1.1; }
      .warm { fill: #2a1d18; stroke: #8b5543; stroke-width: 1.1; }
      .gold { fill: #2a2715; stroke: #756c35; stroke-width: 1.1; }
      .pill { fill: #101218; stroke: #4b5060; stroke-width: 1; }
      .line { stroke: #444957; stroke-width: 2; fill: none; }
      .flow { stroke: url(#pulse); stroke-width: 4; fill: none; stroke-linecap: round; }
      .brand { fill: #fff8ee; font: 800 34px Arial, sans-serif; letter-spacing: 0; }
      .label { fill: #a9aab4; font: 700 14px Arial, sans-serif; letter-spacing: 0.12em; }
      .title { fill: #ffffff; font: 700 24px Arial, sans-serif; letter-spacing: 0; }
      .body { fill: #ecedf2; font: 400 17px Arial, sans-serif; letter-spacing: 0; }
      .small { fill: #c2c5cf; font: 400 15px Arial, sans-serif; letter-spacing: 0; }
      .tiny { fill: #9398a4; font: 400 13px Arial, sans-serif; letter-spacing: 0; }
      .mono { fill: #f3f7ff; font: 400 14px Consolas, monospace; letter-spacing: 0; }
      .metric { fill: #f9c74f; font: 800 32px Arial, sans-serif; letter-spacing: 0; }
      .red { fill: #ff6b6b; }
      .blue { fill: #4cc9f0; }
      .yellow { fill: #f9c74f; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="840"/>
  <rect class="panel" x="42" y="34" width="1236" height="72" rx="10"/>
  <text class="brand" x="72" y="80">The Pulse</text>
  <text class="label" x="252" y="76">AI STORY HARNESS AND TUI EVALUATION LOOP</text>
  <rect class="pill" x="958" y="54" width="132" height="34" rx="17"/>
  <text class="tiny" x="994" y="76">metrics CLI</text>
  <rect class="pill" x="1106" y="54" width="140" height="34" rx="17"/>
  <text class="tiny" x="1142" y="76">source proof</text>

  <text class="label" x="64" y="146">INPUTS</text>
  <rect class="panel" x="64" y="168" width="356" height="532" rx="12"/>
  <rect class="card" x="92" y="198" width="300" height="116" rx="10"/>
  <text class="title" x="116" y="236">Story guide</text>
  <text class="small" x="116" y="268">world rules, pacing, tone,</text>
  <text class="small" x="116" y="292">secrets, endings, constraints</text>
  <rect class="warm" x="92" y="342" width="300" height="132" rx="10"/>
  <text class="title" x="116" y="380">Simulated players</text>
  <text class="small" x="116" y="414">2-5 player groups with</text>
  <text class="small" x="116" y="438">archetypes and spokesperson</text>
  <rect class="card" x="92" y="502" width="300" height="132" rx="10"/>
  <text class="title" x="116" y="540">Narrator config</text>
  <text class="small" x="116" y="574">model, prompt style, language,</text>
  <text class="small" x="116" y="598">turn limit, provider routing</text>

  <text class="label" x="482" y="146">HARNESS AND TUI</text>
  <rect class="panel" x="482" y="168" width="356" height="532" rx="12"/>
  <rect class="soft" x="512" y="198" width="296" height="118" rx="10"/>
  <circle class="blue" cx="536" cy="230" r="7"/>
  <text class="title" x="556" y="238">OpenTUI control</text>
  <text class="small" x="536" y="270">compare prompts or models</text>
  <text class="small" x="536" y="294">from a terminal UI</text>
  <rect class="card" x="512" y="340" width="296" height="142" rx="10"/>
  <text class="label" x="536" y="370">SESSION LOOP</text>
  <text class="small" x="536" y="400">narrator turn -> player talk</text>
  <text class="small" x="536" y="424">-> spokesperson action</text>
  <text class="small" x="536" y="448">-> checkpoint and report</text>
  <rect class="gold" x="512" y="506" width="296" height="126" rx="10"/>
  <text class="title" x="536" y="544">Issue detection</text>
  <text class="small" x="536" y="578">tangents, private moments,</text>
  <text class="small" x="536" y="602">contradictions, pacing notes</text>

  <text class="label" x="900" y="146">PUBLIC-SAFE OUTPUT</text>
  <rect class="panel" x="900" y="168" width="356" height="532" rx="12"/>
  <rect class="card" x="930" y="198" width="296" height="164" rx="10"/>
  <text class="label" x="954" y="228">FRESH METRICS RUN</text>
  <text class="metric" x="954" y="276">6</text>
  <text class="tiny" x="1000" y="274">sessions indexed</text>
  <text class="metric" x="954" y="326">7</text>
  <text class="tiny" x="1000" y="324">average turns</text>
  <rect class="soft" x="930" y="386" width="296" height="118" rx="10"/>
  <text class="title" x="954" y="424">Reports</text>
  <text class="small" x="954" y="456">markdown, transcript, HTML,</text>
  <text class="small" x="954" y="480">cost and timeline artifacts</text>
  <rect class="warm" x="930" y="528" width="296" height="108" rx="10"/>
  <text class="title" x="954" y="566">Public boundary</text>
  <text class="small" x="954" y="598">aggregate metrics only; no keys,</text>
  <text class="small" x="954" y="622">raw transcripts, or media files</text>

  <path class="line" d="M420 434 H482"/>
  <path class="flow" d="M430 434 H472"/>
  <path class="line" d="M838 434 H900"/>
  <path class="flow" d="M848 434 H890"/>

  <rect class="panel" x="64" y="720" width="1192" height="78" rx="10"/>
  <text class="tiny" x="92" y="746">Proof basis: apps/tui React terminal UI, TuiSessionOrchestrator, test-harness session runner, checkpoint/report writers, and a fresh cli:metrics run.</text>
  <text class="tiny" x="92" y="768">This is source-grounded evaluation-loop proof. It does not publish provider credentials, generated media, private transcripts, raw story outputs, or deployment internals.</text>
  <text class="tiny" x="92" y="790">Next proof: deployment review, clean generated narration/media sample, and multiplayer gameplay capture without development overlays.</text>
</svg>
