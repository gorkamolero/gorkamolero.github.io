<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">StreamTUI CLI session proof</title>
  <desc id="desc">A sanitized terminal session showing StreamTUI Go tests passing, VLC playback returning a JSON envelope, and Chromecast device discovery with local names and addresses redacted.</desc>
  <rect width="1200" height="820" fill="#101318"/>
  <rect x="54" y="46" width="1092" height="728" rx="18" fill="#0b0f14" stroke="#d6cbbb" stroke-width="2"/>
  <rect x="54" y="46" width="1092" height="54" rx="18" fill="#171d24"/>
  <circle cx="88" cy="74" r="8" fill="#cf4f43"/>
  <circle cx="116" cy="74" r="8" fill="#c8952d"/>
  <circle cx="144" cy="74" r="8" fill="#5b955a"/>
  <text x="176" y="81" fill="#f7f4ee" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19" font-weight="700">streamtui local proof - redacted</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="23">
    <text x="86" y="146" fill="#6bb2ff">$ go test ./...</text>
    <text x="86" y="188" fill="#dbe5f1">?    streamtui/cmd/streamtui        [no test files]</text>
    <text x="86" y="226" fill="#78d38b">ok   streamtui/internal/cli        cached</text>
    <text x="86" y="264" fill="#78d38b">ok   streamtui/internal/config     cached</text>
    <text x="86" y="302" fill="#78d38b">ok   streamtui/internal/domain     cached</text>
    <text x="86" y="340" fill="#78d38b">ok   streamtui/internal/providers  cached</text>
    <text x="86" y="404" fill="#6bb2ff">$ streamtui play "blade runner" --lang es --vlc --json</text>
    <text x="86" y="446" fill="#dbe5f1">{ "ok": true, "data": {</text>
    <text x="118" y="484" fill="#dbe5f1">"status": "playing", "player": "VLC",</text>
    <text x="118" y="522" fill="#dbe5f1">"magnet": "REDACTED_MAGNET",</text>
    <text x="118" y="560" fill="#dbe5f1">"subtitle_file": "REDACTED_CACHE_PATH"</text>
    <text x="86" y="598" fill="#dbe5f1">}, "error": null, "meta": { "version": "v1" } }</text>
    <text x="86" y="662" fill="#6bb2ff">$ streamtui devices list --json</text>
    <text x="86" y="704" fill="#dbe5f1">{ "ok": true, "data": [</text>
    <text x="118" y="742" fill="#dbe5f1">{ "name": "REDACTED_LOCAL_DEVICE", "address": "REDACTED_LAN_IP" }</text>
  </g>
  <rect x="794" y="644" width="306" height="78" rx="12" fill="#f7f4ee"/>
  <text x="818" y="676" fill="#101318" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Public boundary</text>
  <text x="818" y="704" fill="#343b46" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">No LAN names, IPs, magnets, or cache paths.</text>
</svg>
