<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Land fake before and after workflow</title>
  <desc id="desc">A synthetic before and after workflow showing scattered land research becoming a structured operator decision loop.</desc>
  <rect width="1280" height="760" fill="#101318"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="72" fill="#f7f4ee" font-size="34" font-weight="800">Land Workflow Transformation</text>
    <text x="56" y="108" fill="#aeb5c0" font-size="18">Synthetic before/after view. No owner names, addresses, APNs, exact parcels, or CRM records.</text>

    <rect x="56" y="158" width="520" height="478" rx="8" fill="#f7f4ee"/>
    <text x="88" y="210" fill="#101318" font-size="26" font-weight="800">Before</text>
    <text x="88" y="252" fill="#343b46" font-size="17">County websites</text>
    <text x="88" y="292" fill="#343b46" font-size="17">GIS tabs</text>
    <text x="88" y="332" fill="#343b46" font-size="17">Tax records</text>
    <text x="88" y="372" fill="#343b46" font-size="17">Spreadsheets</text>
    <text x="88" y="412" fill="#343b46" font-size="17">Manual notes</text>
    <text x="88" y="452" fill="#343b46" font-size="17">Operator memory</text>
    <rect x="88" y="520" width="330" height="44" rx="4" fill="#d35d4c"/>
    <text x="112" y="549" fill="#160908" font-size="17" font-weight="800">Decision context scattered</text>

    <g fill="none" stroke="#3d7ec9" stroke-width="6" stroke-linecap="round">
      <path d="M610 392H706"/>
      <path d="M680 360L712 392L680 424"/>
    </g>

    <rect x="704" y="158" width="520" height="478" rx="8" fill="#7bbf7a"/>
    <text x="736" y="210" fill="#071307" font-size="26" font-weight="800">After</text>
    <text x="736" y="252" fill="#071307" font-size="17">Source ingestion</text>
    <text x="736" y="292" fill="#071307" font-size="17">Normalized parcel record</text>
    <text x="736" y="332" fill="#071307" font-size="17">Signal extraction</text>
    <text x="736" y="372" fill="#071307" font-size="17">Deal board status</text>
    <text x="736" y="412" fill="#071307" font-size="17">Due-diligence checklist</text>
    <text x="736" y="452" fill="#071307" font-size="17">Human-owned decision</text>
    <rect x="736" y="520" width="348" height="44" rx="4" fill="#f7f4ee"/>
    <text x="760" y="549" fill="#101318" font-size="17" font-weight="800">Decision loop becomes visible</text>

    <text x="56" y="700" fill="#f7f4ee" font-size="18" font-weight="700">Transformation idea</text>
    <text x="56" y="728" fill="#aeb5c0" font-size="16">The point is not to scrape more data. The point is to turn scattered judgment into a repeatable operating cadence.</text>
  </g>
</svg>
