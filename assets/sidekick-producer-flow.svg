<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sidekick producer workflow</title>
  <desc id="desc">A public-safe diagram of Sidekick showing the Tauri panel, React chat, Mastra sidecar, generation adapters, audio analysis, Ableton hooks, and producer feedback loop.</desc>
  <rect width="1200" height="720" fill="#101318"/>
  <g opacity="0.22" stroke="#f7f4ee" stroke-width="1">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200"/>
    <path d="M120 0V720M240 0V720M360 0V720M480 0V720M600 0V720M720 0V720M840 0V720M960 0V720M1080 0V720"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="7">
    <path d="M174 164C324 112 430 192 562 154C700 114 824 188 1026 132" stroke="#b88a35"/>
    <path d="M170 350C318 292 452 386 606 338C744 294 846 370 1032 306" stroke="#3d7ec9"/>
    <path d="M224 568C374 494 512 590 672 516C812 452 908 528 1042 462" stroke="#5b955a"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(78 88)">
      <rect width="270" height="132" rx="14" fill="#f7f4ee"/>
      <text x="24" y="48" font-size="24" font-weight="700" fill="#101318">Producer panel</text>
      <text x="24" y="82" font-size="18" fill="#343b46">Tauri shell, compact</text>
      <text x="24" y="108" font-size="18" fill="#343b46">desktop workflow</text>
    </g>
    <g transform="translate(456 78)">
      <rect width="288" height="150" rx="14" fill="#b88a35"/>
      <text x="24" y="50" font-size="24" font-weight="700" fill="#160f05">React chat</text>
      <text x="24" y="84" font-size="18" fill="#160f05">prompting, session state,</text>
      <text x="24" y="110" font-size="18" fill="#160f05">creative guidance</text>
    </g>
    <g transform="translate(852 94)">
      <rect width="260" height="126" rx="14" fill="#f7f4ee"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#101318">Mastra sidecar</text>
      <text x="24" y="80" font-size="18" fill="#343b46">agent orchestration,</text>
      <text x="24" y="106" font-size="18" fill="#343b46">tool boundaries</text>
    </g>
    <g transform="translate(104 312)">
      <rect width="286" height="138" rx="14" fill="#3d7ec9"/>
      <text x="24" y="48" font-size="24" font-weight="700" fill="#07101d">Generation adapters</text>
      <text x="24" y="82" font-size="18" fill="#07101d">models, modes, stems,</text>
      <text x="24" y="108" font-size="18" fill="#07101d">creative constraints</text>
    </g>
    <g transform="translate(502 304)">
      <rect width="284" height="150" rx="14" fill="#f7f4ee"/>
      <text x="24" y="50" font-size="24" font-weight="700" fill="#101318">Audio analysis</text>
      <text x="24" y="84" font-size="18" fill="#343b46">track context, timing,</text>
      <text x="24" y="110" font-size="18" fill="#343b46">structure signals</text>
    </g>
    <g transform="translate(860 318)">
      <rect width="252" height="126" rx="14" fill="#3d7ec9"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#07101d">Ableton hooks</text>
      <text x="24" y="80" font-size="18" fill="#07101d">OSC direction, clips,</text>
      <text x="24" y="106" font-size="18" fill="#07101d">session control</text>
    </g>
    <g transform="translate(270 534)">
      <rect width="286" height="118" rx="14" fill="#5b955a"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#071307">Creative loop</text>
      <text x="24" y="80" font-size="18" fill="#071307">ask, generate, listen,</text>
      <text x="24" y="106" font-size="18" fill="#071307">revise, arrange</text>
    </g>
    <g transform="translate(668 534)">
      <rect width="286" height="118" rx="14" fill="#f7f4ee"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#101318">Evidence needed</text>
      <text x="24" y="80" font-size="18" fill="#343b46">panel screenshot, audio</text>
      <text x="24" y="106" font-size="18" fill="#343b46">analysis, DAW demo</text>
    </g>
  </g>
</svg>
