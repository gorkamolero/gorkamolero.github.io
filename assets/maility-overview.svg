<svg xmlns="http://www.w3.org/2000/svg" width="960" height="970" viewBox="0 0 960 970" role="img" aria-labelledby="title desc">
<title id="title">Maility — System overview</title>
<desc id="desc">Web and onboarding clients use Firebase functions; Scheduler and Pub/Sub drive background workers over Firestore. Nylas and Google support mailbox operations, Stripe supports billing, Algolia and delivery integrations project events, and logs and exports support operations.</desc>
