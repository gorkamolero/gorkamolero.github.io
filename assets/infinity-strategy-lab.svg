<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Infinity sanitized strategy lab</title>
  <desc id="desc">A fake-data strategy lab showing source mapping, quote audit, proof windows, and readiness gates.</desc>
  <rect width="1280" height="760" fill="#101318"/>
