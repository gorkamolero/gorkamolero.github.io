<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Mercurius fake operator and forensics screen</title>
  <desc id="desc">A synthetic operator dashboard and post-trade forensic report with fake symbols, fake prices, fake mode state, and no live trading data.</desc>
  <rect width="1280" height="760" fill="#101318"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="72" fill="#f7f4ee" font-size="34" font-weight="800">Mercurius Operator Review</text>
    <text x="56" y="108" fill="#aeb5c0" font-size="18">Synthetic screen for private review. No strategy, account, broker, alert, chat, endpoint, or live log data.</text>

    <rect x="56" y="148" width="1168" height="72" rx="8" fill="#f7f4ee"/>
    <text x="88" y="193" fill="#101318" font-size="24" font-weight="800">Mode: rehearsal</text>
    <text x="330" y="193" fill="#343b46" font-size="18">Session: synthetic</text>
    <text x="550" y="193" fill="#343b46" font-size="18">Manual halt: armed</text>
    <text x="790" y="193" fill="#343b46" font-size="18">Intent queue: 1 fake item</text>
    <rect x="1070" y="166" width="116" height="28" rx="4" fill="#7bbf7a"/>
    <text x="1090" y="186" fill="#071307" font-size="14" font-weight="800">SAFE VIEW</text>

    <rect x="56" y="260" width="350" height="370" rx="8" fill="#f7f4ee"/>
    <text x="88" y="308" fill="#101318" font-size="24" font-weight="800">Open intent</text>
    <text x="88" y="352" fill="#343b46" font-size="17">Symbol: SYN-42</text>
    <text x="88" y="386" fill="#343b46" font-size="17">Side: simulated entry</text>
    <text x="88" y="420" fill="#343b46" font-size="17">Price: 412.36 fake</text>
    <text x="88" y="454" fill="#343b46" font-size="17">Size: masked</text>
    <text x="88" y="488" fill="#343b46" font-size="17">Watcher: signal bundle</text>
    <rect x="88" y="536" width="134" height="42" rx="4" fill="#7bbf7a"/>
    <text x="112" y="563" fill="#071307" font-size="16" font-weight="800">Approve</text>
    <rect x="238" y="536" width="116" height="42" rx="4" fill="#d35d4c"/>
    <text x="266" y="563" fill="#160908" font-size="16" font-weight="800">Reject</text>

    <rect x="464" y="260" width="350" height="370" rx="8" fill="#f7f4ee"/>
    <text x="496" y="308" fill="#101318" font-size="24" font-weight="800">Risk gate</text>
    <text x="496" y="352" fill="#343b46" font-size="17">Size guard: pass</text>
    <text x="496" y="386" fill="#343b46" font-size="17">Session guard: pass</text>
    <text x="496" y="420" fill="#343b46" font-size="17">Duplicate guard: pass</text>
    <text x="496" y="454" fill="#343b46" font-size="17">Mode boundary: rehearsal</text>
    <text x="496" y="488" fill="#343b46" font-size="17">Executor: sandbox adapter</text>
    <rect x="496" y="536" width="238" height="42" rx="4" fill="#4e9af1"/>
    <text x="520" y="563" fill="#07101d" font-size="16" font-weight="800">Decision: reviewable</text>

    <rect x="872" y="260" width="352" height="370" rx="8" fill="#d35d4c"/>
    <text x="904" y="308" fill="#160908" font-size="24" font-weight="800">Forensic trail</text>
    <text x="904" y="352" fill="#160908" font-size="17">09:30 fake market snapshot</text>
    <text x="904" y="386" fill="#160908" font-size="17">09:31 watcher emitted intent</text>
    <text x="904" y="420" fill="#160908" font-size="17">09:31 risk gate passed</text>
    <text x="904" y="454" fill="#160908" font-size="17">09:32 operator reviewed</text>
    <text x="904" y="488" fill="#160908" font-size="17">09:34 replay note attached</text>
    <rect x="904" y="536" width="234" height="42" rx="4" fill="#f7f4ee"/>
    <text x="928" y="563" fill="#101318" font-size="16" font-weight="800">Synthetic report only</text>

    <text x="56" y="700" fill="#f7f4ee" font-size="18" font-weight="700">What this proves</text>
    <text x="56" y="728" fill="#aeb5c0" font-size="16">Operator visibility, risk boundaries, rehearsal discipline, and post-trade investigation without leaking any live edge.</text>
  </g>
</svg>
