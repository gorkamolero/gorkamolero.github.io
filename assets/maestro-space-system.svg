<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Maestro space and task orchestration system</title>
  <desc id="desc">A public-safe diagram showing Maestro as a Claude Code skill that organizes work into spaces, tasks, documents, state synthesis, and optional agent runs.</desc>
  <defs>
    <style>
      .bg { fill: #f7f4ee; }
      .panel { fill: #ffffff; stroke: #d9d2c6; stroke-width: 2; }
      .dark { fill: #101318; }
      .blue { fill: #3d7ec9; }
      .red { fill: #b94d42; }
      .green { fill: #5b955a; }
      .gold { fill: #b88a35; }
      .line { stroke: #101318; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .label { font: 800 32px Inter, Arial, sans-serif; letter-spacing: 0; fill: #101318; }
      .small { font: 700 19px Inter, Arial, sans-serif; letter-spacing: 0; fill: #343b46; }
      .tiny { font: 700 16px Inter, Arial, sans-serif; letter-spacing: 0; fill: #343b46; }
      .white { fill: #f7f4ee; }
      .mono { font: 700 17px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0; fill: #101318; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#101318" />
    </marker>
  </defs>

  <rect class="bg" width="1440" height="900" />
  <rect x="54" y="46" width="1332" height="808" rx="8" class="panel" />

  <text x="90" y="108" class="label">Maestro: work state substrate</text>
  <text x="90" y="144" class="small">A Claude Code skill that turns projects, tasks, and context into queryable work worlds.</text>

  <rect x="90" y="206" width="302" height="482" rx="8" class="dark" />
  <text x="122" y="256" class="white" style="font:800 25px Inter, Arial, sans-serif">Human asks</text>
  <rect x="122" y="300" width="238" height="56" rx="6" fill="#f7f4ee" />
  <text x="142" y="334" class="mono">What matters?</text>
  <rect x="122" y="386" width="238" height="56" rx="6" fill="#f7f4ee" />
  <text x="142" y="420" class="mono">Catch me up</text>
  <rect x="122" y="472" width="238" height="56" rx="6" fill="#f7f4ee" />
  <text x="142" y="506" class="mono">Create a space</text>
  <rect x="122" y="558" width="238" height="56" rx="6" fill="#f7f4ee" />
  <text x="142" y="592" class="mono">Run an agent</text>

  <rect x="508" y="186" width="424" height="522" rx="8" class="panel" />
  <text x="540" y="236" class="label" style="font-size:25px">Claude Code skill</text>
  <text x="540" y="270" class="small">Claude acts as the frontend.</text>
  <rect x="540" y="314" width="360" height="66" rx="6" fill="#e9f0f8" />
  <circle cx="574" cy="347" r="12" class="blue" />
  <text x="598" y="340" class="small">Space organization</text>
  <text x="598" y="365" class="tiny">worlds, nesting, context switching</text>
  <rect x="540" y="404" width="360" height="66" rx="6" fill="#edf4ec" />
  <circle cx="574" cy="437" r="12" class="green" />
  <text x="598" y="430" class="small">Task lifecycle</text>
  <text x="598" y="455" class="tiny">inbox, todo, in progress, done</text>
  <rect x="540" y="494" width="360" height="66" rx="6" fill="#f6eddc" />
  <circle cx="574" cy="527" r="12" class="gold" />
  <text x="598" y="520" class="small">State of the World docs</text>
  <text x="598" y="545" class="tiny">default context per space</text>
  <rect x="540" y="584" width="360" height="66" rx="6" fill="#f3e8e5" />
  <circle cx="574" cy="617" r="12" class="red" />
  <text x="598" y="610" class="small">Agent orchestration hook</text>
  <text x="598" y="635" class="tiny">repo instruction and result handoff</text>

  <rect x="1048" y="206" width="302" height="482" rx="8" class="panel" />
  <text x="1080" y="256" class="label" style="font-size:25px">API-backed state</text>
  <rect x="1080" y="300" width="238" height="56" rx="6" fill="#f7f4ee" stroke="#d9d2c6" stroke-width="2" />
  <text x="1100" y="334" class="small">Spaces</text>
  <rect x="1080" y="386" width="238" height="56" rx="6" fill="#f7f4ee" stroke="#d9d2c6" stroke-width="2" />
  <text x="1100" y="420" class="small">Tasks</text>
  <rect x="1080" y="472" width="238" height="56" rx="6" fill="#f7f4ee" stroke="#d9d2c6" stroke-width="2" />
  <text x="1100" y="506" class="small">Documents</text>
  <rect x="1080" y="558" width="238" height="56" rx="6" fill="#f7f4ee" stroke="#d9d2c6" stroke-width="2" />
  <text x="1100" y="592" class="small">Agent runs</text>

  <path d="M 392 447 C 440 447 460 447 508 447" class="line" marker-end="url(#arrow)" />
  <path d="M 932 447 C 980 447 1000 447 1048 447" class="line" marker-end="url(#arrow)" />
  <path d="M 1199 688 C 1060 786 430 786 241 688" class="line" marker-end="url(#arrow)" />

  <rect x="90" y="746" width="1260" height="74" rx="8" fill="#ffffff" stroke="#d9d2c6" stroke-width="2" />
  <text x="122" y="780" class="small">Public-safe boundary: API host and auth details are redacted here.</text>
  <text x="122" y="806" class="tiny">Before promoting the public repo, rotate any exposed credentials and remove operational endpoint details.</text>
</svg>
