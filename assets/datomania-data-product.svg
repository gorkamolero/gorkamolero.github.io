<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Datomania civic data product</title>
  <desc id="desc">A public-safe diagram of Datomania showing source collection, provenance, Representantes modeling, product tables, API and export routes, and methodology.</desc>
  <rect width="1200" height="720" fill="#101318"/>
  <g opacity="0.22" stroke="#f7f4ee" stroke-width="1">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200"/>
    <path d="M120 0V720M240 0V720M360 0V720M480 0V720M600 0V720M720 0V720M840 0V720M960 0V720M1080 0V720"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="7">
    <path d="M174 166C324 114 438 192 560 154C708 110 818 190 1026 132" stroke="#5b955a"/>
    <path d="M172 352C318 292 456 386 604 338C744 294 846 370 1032 306" stroke="#3d7ec9"/>
    <path d="M224 568C374 494 514 590 672 516C812 452 908 528 1042 462" stroke="#b88a35"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(80 88)">
      <rect width="270" height="132" rx="14" fill="#f7f4ee"/>
      <text x="24" y="48" font-size="24" font-weight="700" fill="#101318">Public sources</text>
      <text x="24" y="82" font-size="18" fill="#343b46">records, institutions,</text>
      <text x="24" y="108" font-size="18" fill="#343b46">source notes</text>
    </g>
    <g transform="translate(456 78)">
      <rect width="288" height="150" rx="14" fill="#5b955a"/>
      <text x="24" y="50" font-size="24" font-weight="700" fill="#071307">Provenance model</text>
      <text x="24" y="84" font-size="18" fill="#071307">where data came from,</text>
      <text x="24" y="110" font-size="18" fill="#071307">how it can be trusted</text>
    </g>
    <g transform="translate(852 94)">
      <rect width="260" height="126" rx="14" fill="#f7f4ee"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#101318">Representantes</text>
      <text x="24" y="80" font-size="18" fill="#343b46">1,257 parliamentarians,</text>
      <text x="24" y="106" font-size="18" fill="#343b46">normalized records</text>
    </g>
    <g transform="translate(104 312)">
      <rect width="286" height="138" rx="14" fill="#3d7ec9"/>
      <text x="24" y="48" font-size="24" font-weight="700" fill="#07101d">Product surface</text>
      <text x="24" y="82" font-size="18" fill="#07101d">tables, search, filters,</text>
      <text x="24" y="108" font-size="18" fill="#07101d">public browsing</text>
    </g>
    <g transform="translate(502 304)">
      <rect width="284" height="150" rx="14" fill="#f7f4ee"/>
      <text x="24" y="50" font-size="24" font-weight="700" fill="#101318">API routes</text>
      <text x="24" y="84" font-size="18" fill="#343b46">structured access,</text>
      <text x="24" y="110" font-size="18" fill="#343b46">export workflows</text>
    </g>
    <g transform="translate(860 318)">
      <rect width="252" height="126" rx="14" fill="#3d7ec9"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#07101d">Methodology</text>
      <text x="24" y="80" font-size="18" fill="#07101d">docs, caveats,</text>
      <text x="24" y="106" font-size="18" fill="#07101d">inspection path</text>
    </g>
    <g transform="translate(270 534)">
      <rect width="286" height="118" rx="14" fill="#b88a35"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#160f05">Verification</text>
      <text x="24" y="80" font-size="18" fill="#160f05">lint, tests, build,</text>
      <text x="24" y="106" font-size="18" fill="#160f05">public repo pushed</text>
    </g>
    <g transform="translate(668 534)">
      <rect width="286" height="118" rx="14" fill="#f7f4ee"/>
      <text x="24" y="46" font-size="24" font-weight="700" fill="#101318">Evidence needed</text>
      <text x="24" y="80" font-size="18" fill="#343b46">screenshots, API capture,</text>
      <text x="24" y="106" font-size="18" fill="#343b46">export terminal proof</text>
    </g>
