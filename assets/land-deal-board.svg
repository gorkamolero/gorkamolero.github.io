<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Land sanitized deal board</title>
  <desc id="desc">A fake-data land deal board showing parcel signals, owner workflow, and due diligence without personal or parcel data.</desc>
  <rect width="1280" height="760" fill="#101318"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="72" fill="#f7f4ee" font-size="34" font-weight="800">Land Deal Ops Board</text>
    <text x="56" y="108" fill="#aeb5c0" font-size="18">Fake-data operator view. No owner names, addresses, APNs, exact parcels, or CRM records.</text>
    <rect x="56" y="154" width="1168" height="84" rx="8" fill="#f7f4ee"/>
    <text x="88" y="204" fill="#101318" font-size="24" font-weight="800">Pipeline</text>
    <text x="220" y="204" fill="#343b46" font-size="18">County source -> normalized parcel -> signal score -> outreach queue -> due diligence</text>
    <g>
      <rect x="56" y="286" width="264" height="330" rx="8" fill="#f7f4ee"/>
      <text x="88" y="334" fill="#101318" font-size="24" font-weight="800">Signals</text>
      <text x="88" y="380" fill="#343b46" font-size="17">Absentee: synthetic</text>
      <text x="88" y="414" fill="#343b46" font-size="17">Tax pressure: medium</text>
      <text x="88" y="448" fill="#343b46" font-size="17">Heir pattern: possible</text>
      <text x="88" y="482" fill="#343b46" font-size="17">Access: needs review</text>
      <rect x="88" y="532" width="190" height="38" rx="4" fill="#7bbf7a"/>
      <text x="108" y="557" fill="#071307" font-size="16" font-weight="800">Score: fake 72</text>
    </g>
    <g>
      <rect x="368" y="286" width="264" height="330" rx="8" fill="#f7f4ee"/>
      <text x="400" y="334" fill="#101318" font-size="24" font-weight="800">Deal board</text>
      <text x="400" y="380" fill="#343b46" font-size="17">Parcel: SYN-PARCEL</text>
      <text x="400" y="414" fill="#343b46" font-size="17">County: Example County</text>
      <text x="400" y="448" fill="#343b46" font-size="17">Acreage: synthetic</text>
      <text x="400" y="482" fill="#343b46" font-size="17">Status: research</text>
      <rect x="400" y="532" width="180" height="38" rx="4" fill="#d35d4c"/>
      <text x="420" y="557" fill="#160908" font-size="16" font-weight="800">No PII shown</text>
    </g>
    <g>
      <rect x="680" y="286" width="264" height="330" rx="8" fill="#f7f4ee"/>
      <text x="712" y="334" fill="#101318" font-size="24" font-weight="800">Outreach</text>
      <text x="712" y="380" fill="#343b46" font-size="17">Owner: redacted</text>
      <text x="712" y="414" fill="#343b46" font-size="17">Address: redacted</text>
      <text x="712" y="448" fill="#343b46" font-size="17">Playbook: research first</text>
      <text x="712" y="482" fill="#343b46" font-size="17">Next step: verify source</text>
      <rect x="712" y="532" width="184" height="38" rx="4" fill="#b88a35"/>
      <text x="732" y="557" fill="#181104" font-size="16" font-weight="800">Human in loop</text>
    </g>
    <g>
      <rect x="992" y="286" width="232" height="330" rx="8" fill="#7bbf7a"/>
      <text x="1024" y="334" fill="#071307" font-size="24" font-weight="800">Copilot</text>
      <text x="1024" y="380" fill="#071307" font-size="17">Checklist: fake</text>
      <text x="1024" y="414" fill="#071307" font-size="17">Risks: access, title</text>
      <text x="1024" y="448" fill="#071307" font-size="17">Evidence: sources</text>
      <text x="1024" y="482" fill="#071307" font-size="17">Decision: hold</text>
    </g>
    <text x="56" y="700" fill="#f7f4ee" font-size="18" font-weight="700">Transformation signal</text>
    <text x="56" y="728" fill="#aeb5c0" font-size="16">Messy county data and operator heuristics become a structured workflow for deciding what to research, contact, and pursue.</text>
  </g>
</svg>
