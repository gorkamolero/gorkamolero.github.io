<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1446" viewBox="0 0 960 1446" role="img" aria-labelledby="title desc">
<title id="title">Maility — Failures and retries</title>
<desc id="desc">Email jobs move from scheduled to sending to completed on successful provider return and local completion. Generic errors reschedule from the prior send time by thirty minutes; a retry count equal to five marks failure and auth errors invalidate the account. Suppression and prior replies abort work. Hourly recovery resets up to one thousand sending jobs without an age predicate.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#100f14"/>
<stop offset=".55" stop-color="#17101d"/>
<stop offset="1" stop-color="#121a1f"/>
</linearGradient>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse">
<path d="M0 0 L8 4 L0 8" fill="none" stroke="#4cc9f0" stroke-width="1.5"/>
</marker>
<style>.bg{fill:url(#bg)}.panel{fill:#17181f;stroke:#3a3d49;stroke-width:1.4}.card{fill:#22232b;stroke:#474b59;stroke-width:1.1}.soft{fill:#16242a;stroke:#366779;stroke-width:1.1}.warm{fill:#2a1d18;stroke:#8b5543;stroke-width:1.1}.gold{fill:#2a2715;stroke:#756c35;stroke-width:1.1}.brand{fill:#fff8ee;font:800 36px Arial,sans-serif}.title{fill:#fff;font:700 25px Arial,sans-serif}.body{fill:#ecedf2;font:400 21px Arial,sans-serif}.small{fill:#c2c5cf;font:400 19px Arial,sans-serif}.label{fill:#a9aab4;font:700 17px Arial,sans-serif;letter-spacing:1.6px}.metric{fill:#f9c74f;font:800 38px Arial,sans-serif}.edge{fill:none;stroke:#4cc9f0;stroke-width:2;marker-end:url(#arrow)}.return{fill:none;stroke:#f9c74f;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}.lifeline{stroke:#474b59;stroke-width:1.4;stroke-dasharray:6 7}.band{fill:#101218;stroke:#3a3d49;stroke-width:1.1}</style>
</defs>
<rect class="bg" width="960" height="1446"/>
<rect class="panel" x="28" y="28" width="904" height="100" rx="10"/>
<text class="brand" x="52" y="72">Maility</text>
<text class="label" x="52" y="106">APPLICATION STATE IS NOT A PROVIDER TRANSACTION</text>
<rect class="card" x="250" y="175" width="460" height="116" rx="12"/>
<text class="title" x="270" y="211">scheduled</text>
<text class="body" x="270" y="245">First or next step is ready</text>
<rect class="soft" x="250" y="355" width="460" height="116" rx="12"/>
<text class="title" x="270" y="391">sending</text>
<text class="body" x="270" y="425">Only scheduled → sending triggers</text>
<rect class="warm" x="250" y="535" width="460" height="116" rx="12"/>
<text class="title" x="270" y="571">Nylas provider call</text>
<text class="body" x="270" y="605">External send; then local completion</text>
<path class="edge" d="M480 291 V355"/>
<path class="edge" d="M480 471 V535"/>
<rect class="soft" x="38" y="725" width="425" height="172" rx="12"/>
<text class="title" x="58" y="761">completed</text>
<text class="body" x="58" y="795">Job + next step + emailSent</text>
<text class="body" x="58" y="824">Counters + prospect state</text>
<text class="body" x="58" y="853">No cross-provider transaction</text>
<rect class="gold" x="497" y="725" width="425" height="172" rx="12"/>
<text class="title" x="517" y="761">Retry or invalidate account</text>
<text class="body" x="517" y="795">401 → account invalid</text>
<text class="body" x="517" y="824">retryLater: old sendAt + 30 min</text>
<text class="body" x="517" y="853">retries === 5 → failed</text>
<path class="edge" d="M380 651 V692 H250 V725"/>
<path class="edge" d="M580 651 V692 H710 V725"/>
<path class="return" d="M922 810 H944 V233 H710"/>
<text class="small" x="745" y="215">reschedule</text>
<rect class="card" x="38" y="968" width="425" height="171" rx="12"/>
<text class="title" x="58" y="1004">Abort paths</text>
<text class="body" x="58" y="1038">Blacklist / unsubscribe</text>
<text class="body" x="58" y="1067">Missing step / previous reply</text>
<text class="body" x="58" y="1096">Journey state changes</text>
<rect class="card" x="497" y="968" width="425" height="171" rx="12"/>
<text class="title" x="517" y="1004">Hourly recovery</text>
<text class="body" x="517" y="1038">Up to 1,000 sending jobs</text>
<text class="body" x="517" y="1067">Reset to scheduled</text>
<text class="body" x="517" y="1096">No age predicate in query</text>
<rect class="warm" x="38" y="1210" width="884" height="142" rx="12"/>
<text class="title" x="58" y="1246">Boundary to defend</text>
<text class="body" x="58" y="1280">Stable job IDs + status/account guards exist.</text>
<text class="body" x="58" y="1309">Nylas send and the later Firestore commit are separate operations.</text>
<path d="M38 1380 H922" stroke="#3a3d49"/>
<text class="small" x="38" y="1413">Recovered backend · source-grounded architecture · no production volume claim</text>
</svg>
